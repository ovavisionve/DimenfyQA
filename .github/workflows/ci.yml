name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ig_dm_engine_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ig_dm_engine_test
      REDIS_URL: redis://localhost:6379/0
      APP_ENV: test
      API_AUTH_ENABLED: "false"
      ANTHROPIC_API_KEY: ""
      APIFY_API_TOKEN: ""

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --tb=short -q --ignore=tests/test_dm_sender.py --ignore=tests/test_research.py

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --tb=short -q --ignore=tests/test_dm_sender.py --ignore=tests/test_research.py
