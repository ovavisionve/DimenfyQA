# Temporary HTTP-only config used during initial SSL certificate setup.
# Used by setup-ssl.sh before the Let's Encrypt cert exists.
# Replace YOUR_DOMAIN with your actual domain.

server {
    listen 80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "OK - waiting for SSL setup";
        add_header Content-Type text/plain;
    }
}
