version: "3.9"
services:
  api:
    build: .
    ports:
      - "1000:1000"
    env_file: .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 1000 --reload
    volumes:
      - .:/app

  worker:
    build: .
    env_file: .env
    depends_on:
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app

  beat:
    build: .
    env_file: .env
    depends_on:
      - redis
      - worker
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - .:/app

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --maxmemory 256mb --maxmemory-policy noeviction --save "900 1" --save "300 10" --save "60 10000"
    volumes:
      - redisdata:/data

volumes:
  redisdata:
