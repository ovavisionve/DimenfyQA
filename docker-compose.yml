version: "3.9"
services:
  api:
    build: .
    ports:
      - "1000:1000"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ig_dm_engine
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 1000 --reload
    volumes:
      - .:/app

  worker:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres.ywxgezapyttdgrbbwdso:fABLETHE21.@aws-0-us-west-2.pooler.supabase.com:5432/postgres
      - REDIS_URL=redis://default:ThjHKKcGyWbcSYwVTMTNXPJrnmmyoqYL@centerbeam.proxy.rlwy.net:44753
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - .:/app

  beat:
    build: .
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ig_dm_engine
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - worker
    command: celery -A app.tasks.celery_app beat --loglevel=info
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ig_dm_engine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec --aof-use-rdb-preamble yes --maxmemory 256mb --maxmemory-policy noeviction --save "900 1" --save "300 10" --save "60 10000"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
